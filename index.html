<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<title>Paper Airplanes</title>
<style>
  .cards { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
  .card .pic { display: grid; place-items: center; background: #fff; border: 2px solid #eee4cc; border-radius: 10px; aspect-ratio: 1; }
  .card .pic svg { width: 80%; height: auto; }
  .badge { position: absolute; top: 8px; right: 8px; font: 700 13px var(--ui); border: 2px solid var(--ink); border-radius: 8px; padding: 0 6px; background: var(--peach); }
  .badge.ok { background: var(--mint); }
  .quick { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin: 4px 0 14px; }
  .quick .btn { width: 100%; }
</style>
</head>
<body>
<header class="top">
  <h1 class="title">Paper Airplanes <small>Print at 100%, two-sided. Fold on the lines, in order. Fly!</small></h1>
  <span class="chip sun" id="count">…</span>
</header>
<main class="wrap">
  <div class="quick">
    <a class="btn go" href="pack.html">🖨️ Print several</a>
    <a class="btn mint" href="research/index.html">🔭 How planes fly</a>
  </div>
  <p class="note">Dashed line <b>- - -</b> = fold <b>in</b> (toward you). Dash-dot <b>-·-·-</b> = fold <b>out</b> (away from you). Follow the numbers. Before your first print, use ⚙️ → 🧪 alignment test.</p>
  <div class="cards" id="cards"></div>
</main>
<script src="js/fold.js"></script>
<script src="data/planes.js"></script>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script src="js/settings.js"></script>
<script>
  (function () {
    const { esc } = APP;
    APP.init(PA.drawerHtml());
    PA.wire();
    function render() {
      const list = PA.planes();
      document.getElementById("count").textContent = list.length + " planes" + (PA.get().show === "approved" ? " (approved)" : " (previews)");
      const box = document.getElementById("cards");
      box.innerHTML = list.length ? "" : "<p class='note'>No approved planes yet. Switch ⚙️ → Planes to show → All (previews).</p>";
      list.forEach(p => {
        const st = FOLD.run(p);
        const a = document.createElement("a"); a.className = "card"; a.href = "plane.html?code=" + p.code;
        a.innerHTML = `<span class="badge${p.approved ? " ok" : ""}">${p.approved ? "✅ approved" : "preview"}</span><div class="pic">${FOLD.picture(st[st.length - 1], 200)}</div><b>${esc(p.name)}</b><div class="meta"><span>#${p.code}</span><span class="t">${"●".repeat(p.level)}${"○".repeat(3 - p.level)}</span><span class="s">${p.steps.length} steps</span></div>`;
        box.append(a);
      });
    }
    PA.onChange = render;
    render();
  })();
</script>
</body>
</html>
